name: Promote Firebase policy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA from a successful push-to-main Verify run
        required: true
        type: string
      confirm_project:
        description: Type virtualartplattform to confirm the production target
        required: true
        type: string
      approval_reference:
        description: Reviewed change, incident, or rollback reference
        required: true
        type: string

permissions: {}

concurrency:
  group: firebase-policy-production
  cancel-in-progress: false

jobs:
  resolve-policy:
    name: Resolve and validate policy artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      NODE_VERSION: 22.23.2
      NPM_VERSION: 10.9.8
      FIREBASE_CLI_VERSION: 15.28.2
      FIREBASE_PROJECT_ID: virtualartplattform
      FIREBASE_STORAGE_BUCKET: virtualartplattform.firebasestorage.app
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
    outputs:
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      manifest_sha256: ${{ steps.verify.outputs.manifest_sha256 }}
      verify_run_id: ${{ steps.resolve.outputs.verify_run_id }}
    steps:
      - name: Validate manual release request
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_PROJECT" = "$FIREBASE_PROJECT_ID"
          node --input-type=module <<'NODE'
          const { APPROVAL_REFERENCE: reference, REQUESTED_SHA: sha } = process.env;
          if (!/^[0-9a-f]{40}$/.test(sha ?? ""))
            throw new Error("commit_sha must be one full lowercase Git commit SHA.");
          if (
            typeof reference !== "string"
            || reference !== reference.trim()
            || !/^[A-Za-z0-9][A-Za-z0-9 ._:/#-]{2,119}$/.test(reference)
          ) throw new Error("approval_reference must be 3-120 bounded review-reference characters.");
          NODE

      - name: Resolve exact successful Verify provenance
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";

          const { GH_TOKEN: token, GITHUB_OUTPUT: output, REPOSITORY: repository, REQUESTED_SHA: sha } = process.env;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const getJson = async (path) => {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub provenance request failed (${response.status}).`);
            return response.json();
          };
          const validRun = (run) =>
            run?.path === ".github/workflows/ci.yml"
            && run?.event === "push"
            && run?.head_branch === "main"
            && run?.head_sha === sha
            && run?.conclusion === "success"
            && run?.repository?.full_name === repository
            && run?.head_repository?.full_name === repository;

          const query = new URLSearchParams({
            event: "push",
            head_sha: sha,
            per_page: "100",
            status: "success",
          });
          const listing = await getJson(`/actions/workflows/ci.yml/runs?${query}`);
          const candidateIds = (listing.workflow_runs ?? [])
            .filter(validRun)
            .sort((left, right) => Number(right.id) - Number(left.id))
            .map((run) => String(run.id));
          if (!candidateIds.length)
            throw new Error("No successful push/main Verify run exists for commit_sha.");

          let selected;
          for (const runId of candidateIds) {
            const run = await getJson(`/actions/runs/${runId}`);
            if (!validRun(run)) continue;
            const artifactName = `lieuva-policy-${sha}-${runId}`;
            const artifactListing = await getJson(`/actions/runs/${runId}/artifacts?per_page=100`);
            const artifacts = (artifactListing.artifacts ?? []).filter(
              (artifact) => artifact.name === artifactName,
            );
            if (
              artifacts.length === 1
              && !artifacts[0].expired
              && /^sha256:[0-9a-f]{64}$/.test(artifacts[0].digest ?? "")
              && String(artifacts[0].workflow_run?.id ?? runId) === runId
            ) {
              selected = { artifact: artifacts[0], artifactName, runId };
              break;
            }
          }
          if (!selected)
            throw new Error("No unique live policy artifact is attached to a successful Verify run.");

          await appendFile(output, [
            `artifact_digest=${selected.artifact.digest}`,
            `artifact_id=${selected.artifact.id}`,
            `artifact_name=${selected.artifactName}`,
            `deploy_sha=${sha}`,
            `verify_run_id=${selected.runId}`,
            "",
          ].join("\n"));
          NODE

      - name: Check out the verified revision for unprivileged validation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve.outputs.deploy_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download only the resolved policy artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.verify_run_id }}
          path: artifacts/policy-release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify source, manifest, and policy bytes without credentials
        id: verify
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          VERIFY_RUN_ID: ${{ steps.resolve.outputs.verify_run_id }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          node scripts/wp3-policy-artifact.mjs verify \
            --output-root artifacts/policy-release \
            --commit-sha "$DEPLOY_SHA" \
            --verify-run-id "$VERIFY_RUN_ID" \
            --node-version "$NODE_VERSION" \
            --npm-version "$NPM_VERSION" \
            --firebase-cli-version "$FIREBASE_CLI_VERSION" \
            --project-id "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET"
          manifest_sha256="$(sha256sum artifacts/policy-release/lieuva-policy-manifest.json | awk '{print $1}')"
          test -n "$manifest_sha256"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          git diff --exit-code

      - name: Record review handoff
        env:
          ARTIFACT_DIGEST: ${{ steps.resolve.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          MANIFEST_SHA256: ${{ steps.verify.outputs.manifest_sha256 }}
          VERIFY_RUN_ID: ${{ steps.resolve.outputs.verify_run_id }}
        run: |
          approval_hash="$(printf '%s' "$APPROVAL_REFERENCE" | sha256sum | awk '{print $1}')"
          {
            echo "### Firebase policy awaiting protected approval"
            echo "- Revision: \`${DEPLOY_SHA}\`"
            echo "- Verify run: \`${VERIFY_RUN_ID}\`"
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- Archive digest: \`${ARTIFACT_DIGEST}\`"
            echo "- Manifest SHA-256: \`${MANIFEST_SHA256}\`"
            echo "- Approval-reference SHA-256: \`${approval_hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-policy:
    name: Promote indexes and rules
    needs: resolve-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      id-token: write
    environment:
      name: firebase-policy-production
      url: https://console.firebase.google.com/project/virtualartplattform/firestore/rules
    env:
      NODE_VERSION: 22.23.2
      NPM_VERSION: 10.9.8
      FIREBASE_CLI_VERSION: 15.28.2
      FIREBASE_PROJECT_ID: virtualartplattform
      FIREBASE_STORAGE_BUCKET: virtualartplattform.firebasestorage.app
      DEPLOY_SHA: ${{ needs.resolve-policy.outputs.deploy_sha }}
      VERIFY_RUN_ID: ${{ needs.resolve-policy.outputs.verify_run_id }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.resolve-policy.outputs.manifest_sha256 }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      FIREBASE_POLICY_SERVICE_ACCOUNT_EMAIL: ${{ vars.FIREBASE_POLICY_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - name: Use the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Redownload the exact immutable policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.resolve-policy.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-policy.outputs.verify_run_id }}
          path: artifacts/privileged-policy
          merge-multiple: true
          digest-mismatch: error

      - name: Recheck immutable bytes and toolchain contract
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { lstat, readFile, readdir } from "node:fs/promises";
          import { relative, resolve, sep } from "node:path";

          const root = resolve("artifacts/privileged-policy");
          const digest = (value) => createHash("sha256").update(value).digest("hex");
          const manifestBytes = await readFile(resolve(root, "lieuva-policy-manifest.json"));
          if (digest(manifestBytes) !== process.env.EXPECTED_MANIFEST_SHA256)
            throw new Error("Policy manifest changed between validation and approval.");
          const manifest = JSON.parse(manifestBytes);
          const expectedManifestKeys = [
            "commitSha", "files", "firebaseCliVersion", "nodeVersion", "npmVersion",
            "projectId", "schema", "storageBucket", "verifyRunId",
          ];
          if (
            !manifest
            || typeof manifest !== "object"
            || Array.isArray(manifest)
            || JSON.stringify(Object.keys(manifest).sort()) !== JSON.stringify(expectedManifestKeys.sort())
            || manifest.schema !== "lieuva-policy-release/v1"
            || manifest.commitSha !== process.env.DEPLOY_SHA
            || manifest.verifyRunId !== process.env.VERIFY_RUN_ID
            || manifest.nodeVersion !== process.env.NODE_VERSION
            || manifest.npmVersion !== process.env.NPM_VERSION
            || manifest.firebaseCliVersion !== process.env.FIREBASE_CLI_VERSION
            || manifest.projectId !== process.env.FIREBASE_PROJECT_ID
            || manifest.storageBucket !== process.env.FIREBASE_STORAGE_BUCKET
          ) throw new Error("Policy manifest identity does not match the approved release.");

          const exactFiles = new Set([
            "firebase-cli/package-lock.json",
            "firebase-cli/package.json",
            "firebase.json",
            "firestore.indexes.json",
            "firestore.rules",
            "storage.rules",
          ]);
          const actual = [];
          const walk = async (directory) => {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = resolve(directory, entry.name);
              const stat = await lstat(path);
              if (stat.isSymbolicLink() || (!stat.isDirectory() && !stat.isFile()))
                throw new Error("Policy release contains a link or special file.");
              if (stat.isDirectory()) await walk(path);
              else {
                const name = relative(root, path).split(sep).join("/");
                if (!/^[-A-Za-z0-9._/+]+$/.test(name))
                  throw new Error(`Policy release contains unsafe path ${name}.`);
                if (name !== "lieuva-policy-manifest.json") {
                  if (!exactFiles.has(name))
                    throw new Error(`Policy release contains forbidden path ${name}.`);
                  actual.push({ path: name, sha256: digest(await readFile(path)), size: stat.size });
                }
              }
            }
          };
          await walk(root);
          actual.sort((left, right) => left.path < right.path ? -1 : left.path > right.path ? 1 : 0);
          if (
            actual.length !== exactFiles.size
            || actual.reduce((total, entry) => total + entry.size, 0) > 4 * 1024 * 1024
            || JSON.stringify(actual) !== JSON.stringify(manifest.files)
          ) throw new Error("Policy file set or digest does not match its manifest.");

          const firebase = JSON.parse(await readFile(resolve(root, "firebase.json"), "utf8"));
          if (
            JSON.stringify(Object.keys(firebase).sort()) !== JSON.stringify(["firestore", "storage"])
            || JSON.stringify(firebase.firestore) !== JSON.stringify({
              indexes: "firestore.indexes.json",
              rules: "firestore.rules",
            })
            || JSON.stringify(firebase.storage) !== JSON.stringify({ rules: "storage.rules" })
          ) throw new Error("Policy Firebase config contains an unexpected target or hook.");
          const firestoreRules = await readFile(resolve(root, "firestore.rules"), "utf8");
          const storageRules = await readFile(resolve(root, "storage.rules"), "utf8");
          if (
            !firestoreRules.startsWith("rules_version = '2';")
            || !firestoreRules.includes("service cloud.firestore")
            || !storageRules.startsWith("rules_version = '2';")
            || !storageRules.includes("service firebase.storage")
          ) throw new Error("Policy rules source contract is invalid.");
          const indexes = JSON.parse(await readFile(resolve(root, "firestore.indexes.json"), "utf8"));
          if (
            JSON.stringify(Object.keys(indexes).sort()) !== JSON.stringify(["fieldOverrides", "indexes"])
            || !Array.isArray(indexes.indexes)
            || !Array.isArray(indexes.fieldOverrides)
            || indexes.indexes.length > 200
            || indexes.fieldOverrides.length > 200
          ) throw new Error("Policy index contract is invalid.");

          const cliPackage = JSON.parse(await readFile(resolve(root, "firebase-cli/package.json"), "utf8"));
          const cliLock = JSON.parse(await readFile(resolve(root, "firebase-cli/package-lock.json"), "utf8"));
          const packageKeys = ["dependencies", "description", "engines", "name", "packageManager", "private", "version"];
          const lockKeys = ["lockfileVersion", "name", "packages", "requires", "version"];
          const rootLockKeys = ["dependencies", "engines", "name", "version"];
          if (
            JSON.stringify(Object.keys(cliPackage).sort()) !== JSON.stringify(packageKeys)
            || cliPackage.name !== "@lieuva/firebase-cli-toolchain"
            || cliPackage.version !== "1.0.0"
            || cliPackage.private !== true
            || JSON.stringify(cliPackage.engines) !== JSON.stringify({ node: process.env.NODE_VERSION })
            || cliPackage.packageManager !== `npm@${process.env.NPM_VERSION}`
            || JSON.stringify(cliPackage.dependencies) !== JSON.stringify({ "firebase-tools": process.env.FIREBASE_CLI_VERSION })
            || JSON.stringify(Object.keys(cliLock).sort()) !== JSON.stringify(lockKeys)
            || cliLock.lockfileVersion !== 3
            || cliLock.requires !== true
            || cliLock.name !== cliPackage.name
            || cliLock.version !== cliPackage.version
            || JSON.stringify(Object.keys(cliLock.packages?.[""] ?? {}).sort()) !== JSON.stringify(rootLockKeys)
            || cliLock.packages?.[""]?.name !== cliPackage.name
            || cliLock.packages?.[""]?.version !== cliPackage.version
            || JSON.stringify(cliLock.packages?.[""]?.engines) !== JSON.stringify(cliPackage.engines)
            || JSON.stringify(cliLock.packages?.[""]?.dependencies) !== JSON.stringify(cliPackage.dependencies)
            || cliLock.packages?.["node_modules/firebase-tools"]?.version !== process.env.FIREBASE_CLI_VERSION
          ) throw new Error("Firebase CLI lock inputs do not match the approved toolchain.");

          const forbiddenReference = /^(?:file:|link:|git(?:\+|:)|github:|https?:|ssh:)/i;
          const dependencyClasses = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"];
          const lockPackages = Object.entries(cliLock.packages ?? {});
          if (lockPackages.length < 2 || lockPackages.length > 2_000)
            throw new Error("Firebase CLI lock package count is invalid.");
          for (const [path, dependency] of lockPackages) {
            if (!path) continue;
            if (
              !path.startsWith("node_modules/")
              || path.includes("\\")
              || path.split("/").some((part) => !part || part === "." || part === "..")
              || !dependency
              || typeof dependency !== "object"
              || Array.isArray(dependency)
              || dependency.link === true
              || dependency.inBundle === true
              || typeof dependency.version !== "string"
              || forbiddenReference.test(dependency.version)
            ) throw new Error(`Firebase CLI lock contains unsafe package ${path}.`);
            let registry;
            try { registry = new URL(dependency.resolved); } catch { registry = undefined; }
            if (
              registry?.protocol !== "https:"
              || registry.hostname !== "registry.npmjs.org"
              || registry.port
              || registry.username
              || registry.password
              || registry.search
              || registry.hash
              || !registry.pathname.endsWith(".tgz")
            ) throw new Error(`Firebase CLI lock has unsafe registry URL for ${path}.`);
            const encoded = typeof dependency.integrity === "string" && dependency.integrity.startsWith("sha512-")
              ? dependency.integrity.slice("sha512-".length)
              : "";
            const integrityBytes = Buffer.from(encoded, "base64");
            if (
              !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)
              || integrityBytes.length !== 64
              || integrityBytes.toString("base64") !== encoded
            ) throw new Error(`Firebase CLI lock has weak integrity for ${path}.`);
            for (const dependencyClass of dependencyClasses) {
              const references = dependency[dependencyClass];
              if (references === undefined) continue;
              if (!references || typeof references !== "object" || Array.isArray(references))
                throw new Error(`Firebase CLI lock ${path} has malformed ${dependencyClass}.`);
              for (const reference of Object.values(references)) {
                if (typeof reference !== "string" || forbiddenReference.test(reference))
                  throw new Error(`Firebase CLI lock ${path} has unsafe ${dependencyClass} reference.`);
              }
            }
          }
          if (!/^projects\/[0-9]+\/locations\/global\/workloadIdentityPools\/[^/]+\/providers\/[^/]+$/.test(process.env.GCP_WORKLOAD_IDENTITY_PROVIDER ?? ""))
            throw new Error("Workload Identity provider is missing or invalid.");
          if (!/^[^@\s]+@[^@\s]+[.]iam[.]gserviceaccount[.]com$/.test(process.env.FIREBASE_POLICY_SERVICE_ACCOUNT_EMAIL ?? ""))
            throw new Error("Policy service account is missing or invalid.");
          if (
            process.env.APPROVAL_REFERENCE !== process.env.APPROVAL_REFERENCE?.trim()
            || !/^[A-Za-z0-9][A-Za-z0-9 ._:/#-]{2,119}$/.test(process.env.APPROVAL_REFERENCE ?? "")
          ) throw new Error("Approval reference changed after unprivileged validation.");
          NODE

      - name: Install digest-bound Firebase CLI without lifecycle scripts
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          npm ci --prefix artifacts/privileged-policy/firebase-cli --ignore-scripts --no-audit --no-fund
          node -e 'const f=require("node:fs"); const p=JSON.parse(f.readFileSync("artifacts/privileged-policy/firebase-cli/node_modules/firebase-tools/package.json", "utf8")); if(p.version!==process.env.FIREBASE_CLI_VERSION) process.exit(1)'

      - name: Authenticate policy promoter with short-lived credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.FIREBASE_POLICY_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Promote additive indexes, wait for readiness, then promote and prove rules
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { appendFile, readFile } from "node:fs/promises";
          import { resolve } from "node:path";

          const root = resolve("artifacts/privileged-policy");
          const project = process.env.FIREBASE_PROJECT_ID;
          const bucket = process.env.FIREBASE_STORAGE_BUCKET;
          const token = process.env.GOOGLE_OAUTH_ACCESS_TOKEN;
          if (!token) throw new Error("Policy promotion has no short-lived access token.");
          const headers = { Authorization: `Bearer ${token}` };
          const hash = (value) => createHash("sha256").update(value).digest("hex");
          const desired = JSON.parse(await readFile(resolve(root, "firestore.indexes.json"), "utf8"));
          const firestoreSource = await readFile(resolve(root, "firestore.rules"), "utf8");
          const storageSource = await readFile(resolve(root, "storage.rules"), "utf8");
          const cli = resolve(root, "firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js");

          const fetchJson = async (url) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Policy parity request failed (${response.status}).`);
            return response.json();
          };
          const fetchPages = async (initialUrl, property) => {
            const entries = [];
            let pageToken = "";
            do {
              const url = new URL(initialUrl);
              url.searchParams.set("pageSize", "100");
              if (pageToken) url.searchParams.set("pageToken", pageToken);
              const page = await fetchJson(url);
              entries.push(...(page[property] ?? []));
              pageToken = page.nextPageToken ?? "";
            } while (pageToken);
            return entries;
          };
          const releases = async () => fetchPages(
            `https://firebaserules.googleapis.com/v1/projects/${project}/releases`,
            "releases",
          );
          const activeRule = async (releaseName, fileName) => {
            const release = (await releases()).find((entry) => entry.name === releaseName);
            if (!release?.rulesetName) return null;
            const ruleset = await fetchJson(`https://firebaserules.googleapis.com/v1/${release.rulesetName}`);
            const files = ruleset.source?.files ?? [];
            if (files.length !== 1 || files[0]?.name !== fileName || typeof files[0]?.content !== "string")
              throw new Error(`Active ${fileName} ruleset has an unexpected source contract.`);
            return { content: files[0].content, rulesetName: release.rulesetName };
          };

          const fieldMode = (field) => ({
            fieldPath: field.fieldPath,
            ...(field.order ? { order: field.order } : { arrayConfig: field.arrayConfig }),
          });
          const desiredIndexKey = (index) => {
            const fields = index.fields.map(fieldMode);
            const lastOrder = fields.reduce((order, field) => field.order ?? order, "ASCENDING");
            if (fields.at(-1)?.fieldPath !== "__name__")
              fields.push({ fieldPath: "__name__", order: lastOrder });
            return JSON.stringify({
              collectionGroup: index.collectionGroup,
              fields,
              queryScope: index.queryScope,
            });
          };
          const remoteIndexKey = (index) => {
            const match = index.name?.match(/\/collectionGroups\/([^/]+)\/indexes\//);
            if (!match) throw new Error("Firestore returned an invalid index resource name.");
            return JSON.stringify({
              collectionGroup: decodeURIComponent(match[1]),
              fields: (index.fields ?? []).map(fieldMode),
              queryScope: index.queryScope,
            });
          };
          const overrideName = (field) => {
            const match = field.name?.match(/\/collectionGroups\/([^/]+)\/fields\/(.+)$/);
            if (!match) throw new Error("Firestore returned an invalid field resource name.");
            return `${decodeURIComponent(match[1])}\n${decodeURIComponent(match[2])}`;
          };
          const overrideModes = (indexes) => (indexes ?? [])
            .map((index) => JSON.stringify({
              ...(index.fields?.[0]?.order
                ? { order: index.fields[0].order }
                : { arrayConfig: index.fields?.[0]?.arrayConfig }),
              queryScope: index.queryScope,
            }))
            .sort();
          const remotePolicyIndexes = async () => {
            const indexes = await fetchPages(
              `https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/collectionGroups/-/indexes`,
              "indexes",
            );
            const fieldUrl = new URL(
              `https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/collectionGroups/-/fields`,
            );
            fieldUrl.searchParams.set(
              "filter",
              "indexConfig.usesAncestorConfig=false OR ttlConfig:*",
            );
            const fields = await fetchPages(fieldUrl, "fields");
            return { fields, indexes };
          };
          const policyIndexStatus = async () => {
            const remote = await remotePolicyIndexes();
            const byKey = new Map(remote.indexes.map((index) => [remoteIndexKey(index), index]));
            const desiredKeys = new Set(desired.indexes.map(desiredIndexKey));
            const missing = [];
            const unready = [];
            for (const index of desired.indexes) {
              const key = desiredIndexKey(index);
              const current = byKey.get(key);
              if (!current) missing.push(key);
              else if (current.state !== "READY") unready.push(current.state ?? "UNKNOWN");
            }
            const fieldsByName = new Map(remote.fields.map((field) => [overrideName(field), field]));
            const desiredFieldKeys = new Set(desired.fieldOverrides.map(
              (field) => `${field.collectionGroup}\n${field.fieldPath}`,
            ));
            const fieldMismatches = [];
            for (const field of desired.fieldOverrides) {
              const key = `${field.collectionGroup}\n${field.fieldPath}`;
              const current = fieldsByName.get(key);
              const expectedModes = field.indexes
                .map((index) => JSON.stringify(index))
                .sort();
              const currentModes = current ? overrideModes(current.indexConfig?.indexes) : undefined;
              if (!currentModes || JSON.stringify(currentModes) !== JSON.stringify(expectedModes)) {
                fieldMismatches.push(key);
                continue;
              }
              if ((current.indexConfig?.indexes ?? []).some((index) => index.state !== "READY"))
                fieldMismatches.push(`${key} (not READY)`);
              const expectedTtl = field.ttl === true;
              const currentTtlState = current?.ttlConfig?.state;
              if (expectedTtl ? currentTtlState !== "ACTIVE" : currentTtlState !== undefined)
                fieldMismatches.push(`${key} (TTL ${currentTtlState ?? "disabled"})`);
            }
            const unexpectedFieldOverrides = [...fieldsByName.keys()]
              .filter((key) => !desiredFieldKeys.has(key))
              .sort();
            return {
              extraCompositeIndexes: remote.indexes.filter((index) => !desiredKeys.has(remoteIndexKey(index))).length,
              fieldMismatches,
              missing,
              unexpectedFieldOverrides,
              unready,
            };
          };
          const runCli = (only) => {
            const result = spawnSync(process.execPath, [
              cli,
              "deploy",
              "--config", "firebase.json",
              "--project", project,
              "--only", only,
              "--non-interactive",
            ], { cwd: root, env: { ...process.env, CI: "true" }, stdio: "inherit" });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`Firebase ${only} promotion failed.`);
          };

          const firestoreRelease = `projects/${project}/releases/cloud.firestore`;
          const storageRelease = `projects/${project}/releases/firebase.storage/${bucket}`;
          const [beforeFirestore, beforeStorage] = await Promise.all([
            activeRule(firestoreRelease, "firestore.rules"),
            activeRule(storageRelease, "storage.rules"),
          ]);
          const beforeIndexStatus = await policyIndexStatus();
          if (beforeIndexStatus.unexpectedFieldOverrides.length)
            throw new Error(`Production Firestore has undeclared field overrides or TTL policies: ${beforeIndexStatus.unexpectedFieldOverrides.join(", ").slice(0, 2_000)}`);

          // Never pass --force: policy promotion may add required indexes and
          // overrides, but stale production indexes require a separate migration.
          runCli("firestore:indexes");
          let readyStatus;
          for (let attempt = 0; attempt < 80; attempt += 1) {
            readyStatus = await policyIndexStatus();
            if (readyStatus.unexpectedFieldOverrides.length)
              throw new Error(`Production Firestore gained undeclared field overrides or TTL policies: ${readyStatus.unexpectedFieldOverrides.join(", ").slice(0, 2_000)}`);
            if (
              !readyStatus.missing.length
              && !readyStatus.unready.length
              && !readyStatus.fieldMismatches.length
            ) break;
            if (readyStatus.unready.includes("NEEDS_REPAIR"))
              throw new Error("A required Firestore index needs repair.");
            if (attempt === 79)
              throw new Error("Required Firestore indexes did not reach READY within 20 minutes.");
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          runCli("firestore:rules,storage");
          const [afterFirestore, afterStorage, afterIndexStatus] = await Promise.all([
            activeRule(firestoreRelease, "firestore.rules"),
            activeRule(storageRelease, "storage.rules"),
            policyIndexStatus(),
          ]);
          if (
            !afterFirestore
            || !afterStorage
            || hash(afterFirestore.content) !== hash(firestoreSource)
            || hash(afterStorage.content) !== hash(storageSource)
            || afterIndexStatus.missing.length
            || afterIndexStatus.unready.length
            || afterIndexStatus.fieldMismatches.length
            || afterIndexStatus.unexpectedFieldOverrides.length
          ) throw new Error("Production Firebase policy did not reach source and READY-index parity.");

          const approvalHash = hash(process.env.APPROVAL_REFERENCE);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            "### Firebase policy promotion proved",
            `- Revision: \`${process.env.DEPLOY_SHA}\``,
            `- Verify run: \`${process.env.VERIFY_RUN_ID}\``,
            `- Firebase CLI: \`${process.env.FIREBASE_CLI_VERSION}\``,
            `- Firestore ruleset: \`${afterFirestore.rulesetName}\``,
            `- Storage ruleset: \`${afterStorage.rulesetName}\``,
            `- Firestore SHA-256: \`${hash(firestoreSource)}\``,
            `- Storage SHA-256: \`${hash(storageSource)}\``,
            `- Required indexes/overrides: \`READY\``,
            `- Undeclared field overrides/TTL policies: \`${afterIndexStatus.unexpectedFieldOverrides.length}\``,
            `- Extra composite indexes retained: \`${afterIndexStatus.extraCompositeIndexes}\``,
            `- Before deploy: Firestore rules \`${beforeFirestore && hash(beforeFirestore.content) === hash(firestoreSource) ? "in parity" : "changed"}\`, Storage rules \`${beforeStorage && hash(beforeStorage.content) === hash(storageSource) ? "in parity" : "changed"}\`, indexes \`${beforeIndexStatus.missing.length + beforeIndexStatus.unready.length + beforeIndexStatus.fieldMismatches.length + beforeIndexStatus.unexpectedFieldOverrides.length ? "changed" : "in parity"}\``,
            `- Approval-reference SHA-256: \`${approvalHash}\``,
            "",
          ].join("\n"));
          NODE
