name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: firebase-production
      url: https://virtualartplattform.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      - run: npm run check:functions
      - name: Prepare Firebase Functions parameters
        env:
          AURA_PUBLIC_APP_URL: ${{ vars.AURA_PUBLIC_APP_URL }}
          AURA_REPLY_TO: ${{ vars.AURA_REPLY_TO }}
          AURA_LEGAL_FOOTER: ${{ vars.AURA_LEGAL_FOOTER }}
        run: |
          node -e 'const fs = require("node:fs"); const values = { AURA_PUBLIC_APP_URL: process.env.AURA_PUBLIC_APP_URL, AURA_REPLY_TO: process.env.AURA_REPLY_TO, AURA_LEGAL_FOOTER: process.env.AURA_LEGAL_FOOTER }; fs.writeFileSync("functions/.env.virtualartplattform", Object.entries(values).map(([key, value]) => key + "=" + JSON.stringify(value || "")).join("\n") + "\n");'
      - name: Authenticate Firebase deployer
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: virtualartplattform
      - name: Deploy Hosting and Functions
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          AURA_PUBLIC_APP_URL: ${{ vars.AURA_PUBLIC_APP_URL }}
          AURA_REPLY_TO: ${{ vars.AURA_REPLY_TO }}
          AURA_LEGAL_FOOTER: ${{ vars.AURA_LEGAL_FOOTER }}
        run: >-
          npx --yes firebase-tools@latest deploy
          --only "hosting,functions"
          --project virtualartplattform
          --non-interactive
