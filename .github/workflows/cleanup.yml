name: Clean up expired galleries
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cleanup-expired-galleries
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: firebase-cleanup
    env:
      FIREBASE_PROJECT_ID: virtualartplattform
      FIREBASE_STORAGE_BUCKET: virtualartplattform.firebasestorage.app
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      FIREBASE_CLEANUP_SERVICE_ACCOUNT_EMAIL: ${{ vars.FIREBASE_CLEANUP_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - name: Check out the immutable default-branch revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Verify exact current main provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/git/ref/heads/main`, {
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!response.ok) throw new Error(`GitHub main-head request failed (${response.status}).`);
          const main = await response.json();
          if (main.object?.sha !== process.env.GITHUB_SHA)
            throw new Error("Cleanup revision is not the current immutable main head.");
          NODE

      - name: Validate cleanup identity configuration
        run: |
          set -euo pipefail
          if [[ ! "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER is missing or invalid." >&2
            exit 1
          fi
          if [[ ! "$FIREBASE_CLEANUP_SERVICE_ACCOUNT_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+[.]iam[.]gserviceaccount[.]com$ ]]; then
            echo "FIREBASE_CLEANUP_SERVICE_ACCOUNT_EMAIL is missing or invalid." >&2
            exit 1
          fi
      - name: Authenticate cleanup worker
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.FIREBASE_CLEANUP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_scopes: |-
            https://www.googleapis.com/auth/datastore
            https://www.googleapis.com/auth/devstorage.read_write
      - name: Delete expired galleries and assets
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/cleanup-expired.mjs
