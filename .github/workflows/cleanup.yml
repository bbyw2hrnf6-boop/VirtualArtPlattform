name: Clean up expired galleries
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cleanup-expired-galleries
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate cleanup worker
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |-
            https://www.googleapis.com/auth/datastore
            https://www.googleapis.com/auth/devstorage.read_write
      - name: Delete expired galleries and assets
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: virtualartplattform
          FIREBASE_STORAGE_BUCKET: virtualartplattform.firebasestorage.app
        run: node scripts/cleanup-expired.mjs
