<!doctype html>
<html lang="de" data-theme="orbit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d111b">
  <title>LIEUVA · Agentenzentrale</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./network.css">
  <script src="./i18n.js" defer></script>
  <script src="./network-ui.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <div class="brand"><span class="brand-mark" aria-hidden="true">L</span><span><strong>LIEUVA</strong><small>AGENTENZENTRALE</small></span></div>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="nav" aria-label="Bereiche">
        <button type="button" data-view="overview" class="nav-button active"><span aria-hidden="true">◉</span> Übersicht</button>
        <button type="button" data-view="agents" class="nav-button"><span aria-hidden="true">◈</span> Agenten</button>
        <button type="button" data-view="proposals" class="nav-button"><span aria-hidden="true">▤</span> Vorschläge <span id="navProposalCount" class="nav-count">0</span></button>
        <button type="button" data-view="runs" class="nav-button"><span aria-hidden="true">▥</span> Läufe</button>
        <button type="button" data-view="network" class="nav-button"><span aria-hidden="true">⌁</span> Zusammenspiel</button>
        <button type="button" data-view="settings" class="nav-button"><span aria-hidden="true">⚙</span> Einstellungen</button>
      </nav>
      <div class="sidebar-foot"><span class="online-dot"></span><span id="connectionLabel">Verbinde lokal …</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb"><span>LIEUVA</span><span class="slash">/</span><strong id="viewLabel">Übersicht</strong></div>
        <div class="topbar-right"><span class="topbar-time" id="todayLabel"></span><label class="display-control"><span>Design</span><select id="themeSelect" aria-label="Design"><option value="clear">CLEAR</option><option value="orbit">ORBIT</option></select></label><label class="display-control"><span>Sprache</span><select id="languageSelect" aria-label="Sprache"><option value="de">Deutsch</option><option value="en">English</option></select></label><span class="local-pill"><span class="online-dot"></span> LOCAL WORKSPACE</span></div>
      </header>
      <div id="app" class="content"><div class="loading">Agentenzentrale wird geladen …</div></div>
    </main>
  </div>
  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
